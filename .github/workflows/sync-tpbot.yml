name: Bouw Nederlandse TPBot-extensie

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Haal officiële TPBot-code op
        run: |
          rm -rf /tmp/tpbot
          git clone --depth 1 https://github.com/elecfreaks/pxt-TPBot.git /tmp/tpbot
          rm -rf /tmp/tpbot/.git
          cp -a /tmp/tpbot/. ./

      - name: Vertaal zichtbare blokken rechtstreeks in main.ts
        shell: python
        run: |
          from pathlib import Path
          import json

          p = Path('main.ts')
          s = p.read_text(encoding='utf-8')

          # De Engelse broncode blijft functioneel identiek; alleen teksten die
          # leerlingen in de blokken zien worden vervangen.
          replacements = {
            'Set left wheel speed at %lspeed\\%| right wheel speed at %rspeed\\%': 'stel linkerwiel in op %lspeed\\%| rechterwiel op %rspeed\\%',
            'Go %direc at speed %speed\\% for %time seconds': 'rijd %direc met snelheid %speed\\% gedurende %time seconden',
            'Go %direc at speed %speed\\%': 'rijd %direc met snelheid %speed\\%',
            'Stop the car immediately': 'stop',
            '%side line sensor detected %state': '%side lijnsensor detecteert %state',
            'Line sensor state is %state': 'lijnsensoren zijn %state',
            'On %side| line sensor detected %state': 'wanneer de %side lijnsensor %state detecteert',
            'Sonar distance unit %unit': 'meet afstand in %unit',
            'Sonar distance %judge %dis cm': 'is de afstand %judge %dis cm?',
            'Set headlight color to $color': 'stel koplampkleur in op $color',
            'Set headlight color to R:%r G:%g B:%b': 'stel koplampkleur in op R:%r G:%g B:%b',
            'Turn off the headlights': 'zet koplampen uit',
            'Set 360° servo %servo speed to %speed \\%': 'stel servo %servo in op snelheid %speed \\%',
            'Set %servoType servo %servo angle to %angle °': 'stel %servoType servo %servo in op %angle°',
            'set left wheel speed %lspeed, right wheel speed %rspeed %unit': 'stel linkerwiel in op %lspeed, rechterwiel op %rspeed %unit',
            'go %Direction %distance %DistanceUnit': 'rijd %Direction %distance %DistanceUnit',
            'set length of the squares as %length %DistanceUnit': 'stel de lengte van een vak in op %length %DistanceUnit',
            'go forward %cnt squares': 'rijd %cnt vakken vooruit',
            'set car %TurnUnit for angle %angle': 'draai de TPBot %TurnUnit over %angle°',
            'Forward': 'vooruit',
            'Backward': 'achteruit',
            'Left': 'links',
            'Right': 'rechts',
            'Black': 'zwart',
            'White': 'wit',
            'Play': 'afspelen',
            'Happy': 'vrolijk',
            'Red': 'rood',
            'Green': 'groen',
            'Blue': 'blauw',
            'Cyan': 'cyaan',
            'Magenta': 'magenta',
            'Yellow': 'geel',
            'WheelLeft': 'linkerwiel',
            'WheelRight': 'rechterwiel',
            'WheelALL': 'beide wielen',
            'Angle': 'graden',
            'Circle': 'omwentelingen',
            'Leftsteering': 'naar links',
            'Rightsteering': 'naar rechts',
            'Stay_Leftsteering': 'links blijven sturen',
            'Stay_Rightsteering': 'rechts blijven sturen',
            'TPBot_Pro': 'TPBot Pro',
            'cm/s': 'cm/s',
            'inch/s': 'inch/s',
            'inches': 'inch',
        }

          # Vervang uitsluitend waarden binnen //% block="..." of //%block="..."
          import re
          def translate_block(m):
              prefix, text, suffix = m.group(1), m.group(2), m.group(3)
              for old, new in replacements.items():
                  text = text.replace(old, new)
              return prefix + text + suffix

          s = re.sub(r'(//%\\s*block=")(.*?)(")', translate_block, s)
          p.write_text(s, encoding='utf-8')

          # Metadata
          meta = Path('pxt.json')
          data = json.loads(meta.read_text(encoding='utf-8'))
          data['name'] = 'pxt-tpbot-nederlands'
          data['description'] = 'Nederlandstalige TPBot-extensie voor Microsoft MakeCode en micro:bit.'
          meta.write_text(json.dumps(data, ensure_ascii=False, indent=4) + '\\n', encoding='utf-8')

          # Laat MakeCode niet afhankelijk zijn van de oude vertaalbestanden.
          loc = Path('_locales/nl')
          if loc.exists():
              for f in loc.glob('*.json'):
                  f.unlink()

      - name: Controleer Engelse blokteksten
        shell: python
        run: |
          from pathlib import Path
          import re
          s = Path('main.ts').read_text(encoding='utf-8')
          blocks = re.findall(r'//%\\s*block="(.*?)"', s)
          print('Aantal blokken:', len(blocks))
          for b in blocks:
              print(b)

      - name: Commit Nederlandse versie
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Gebruik Nederlandse blokteksten rechtstreeks in main.ts" || echo "Geen wijzigingen"
          git push
